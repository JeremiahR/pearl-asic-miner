<rect x="170.0" y="156.0" width="110.3" height="22.0" rx="0" class="f1"/>
<rect x="282.3" y="156.0" width="13.8" height="22.0" rx="0" class="f2"/>
<rect x="298.1" y="156.0" width="13.5" height="22.0" rx="0" class="f3"/>
<path d="M313.6,156.0 H316.8 Q320.0,156.0 320.0,159.2 V174.8 Q320.0,178.0 316.8,178.0 H313.6 Z" class="f4"/>
<text x="330.0" y="171.0" class="val" text-anchor="start">18.6 fJ chip · 21.2 wall</text>
<text x="20.0" y="219.0" class="lab" text-anchor="start">PA-3 Stacked N2</text>
<rect x="170.0" y="206.0" width="59.3" height="22.0" rx="0" class="f1"/>
<rect x="231.3" y="206.0" width="3.9" height="22.0" rx="0" class="f2"/>
