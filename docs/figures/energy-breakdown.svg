<rect x="468.6" y="106.0" width="66.4" height="22.0" rx="0" class="f2"/>
<rect x="537.0" y="106.0" width="50.7" height="22.0" rx="0" class="f3"/>
<path d="M589.7,106.0 H606.5 Q610.5,106.0 610.5,110.0 V124.0 Q610.5,128.0 606.5,128.0 H589.7 Z" class="f4"/>
<text x="620.5" y="121.0" class="val" text-anchor="start">54.2 fJ chip · 63.8 wall</text>
