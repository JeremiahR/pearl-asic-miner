<svg xmlns="http://www.w3.org/2000/svg" width="780" height="376" viewBox="0 0 780 376" role="img" aria-label="Net efficiency of ASIC design versions vs H100 and B200">
<title>Net efficiency of ASIC design versions vs H100 and B200</title>
<style>text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif} .title{font-size:16px;font-weight:600} .sub{font-size:12px} .lab{font-size:12px} .lab2{font-size:11px} .val{font-size:11.5px;font-variant-numeric:tabular-nums} .tick{font-size:11px;font-variant-numeric:tabular-nums} .note{font-size:11px} .grid,.base,.ref{stroke-width:1} .ring{stroke-width:2} .l1,.l2,.l3{stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round} .refbold{stroke-width:2.5} .strong{font-size:12.5px;font-weight:600} .region{font-size:22px;font-weight:700;letter-spacing:0.5px} .regionsub{font-size:12px} .b1,.b2,.b3{stroke:none} .w1,.w2{stroke-width:2;stroke-linecap:round}
.bg{fill:#fcfcfb} .title,.lab,.val{fill:#0b0b0b} .sub,.lab2{fill:#52514e} .tick,.note{fill:#898781} .grid{stroke:#e1e0d9} .base{stroke:#c3c2b7} .ref{stroke:#52514e} .wash{fill:rgba(11,11,11,0.05)} .ring{stroke:#fcfcfb} .f1{fill:#2a78d6} .f2{fill:#eb6834} .f3{fill:#1baf7a} .f4{fill:#eda100} .l1,.w1{stroke:#2a78d6} .l2,.w2{stroke:#eb6834} .l3{stroke:#1baf7a} .b1{fill:#2a78d6;fill-opacity:0.2} .b2{fill:#eb6834;fill-opacity:0.2} .b3{fill:#1baf7a;fill-opacity:0.2} .refbold{stroke:#0b0b0b} .strong,.region{fill:#0b0b0b} .regionsub{fill:#52514e}
@media (prefers-color-scheme: dark) { .bg{fill:#1a1a19} .title,.lab,.val{fill:#f0efec} .sub,.lab2{fill:#c3c2b7} .tick,.note{fill:#898781} .grid{stroke:#2c2c2a} .base{stroke:#383835} .ref{stroke:#c3c2b7} .wash{fill:rgba(255,255,255,0.06)} .ring{stroke:#1a1a19} .f1{fill:#3987e5} .f2{fill:#d95926} .f3{fill:#199e70} .f4{fill:#c98500} .l1,.w1{stroke:#3987e5} .l2,.w2{stroke:#d95926} .l3{stroke:#199e70} .b1{fill:#3987e5;fill-opacity:0.2} .b2{fill:#d95926;fill-opacity:0.2} .b3{fill:#199e70;fill-opacity:0.2} .refbold{stroke:#f0efec} .strong,.region{fill:#f0efec} .regionsub{fill:#c3c2b7} }</style>
<rect x="0.0" y="0.0" width="780.0" height="376.0" rx="0" class="bg"/>
<text x="20.0" y="28.0" class="title" text-anchor="start">Net efficiency: ASIC design versions vs NVIDIA GPUs</text>
<text x="20.0" y="47.0" class="sub" text-anchor="start">Wall-plug FP8 dense TFLOPS per watt, log scale. Whiskers: switching energy x2 (left) to x0.5 (right).</text>
