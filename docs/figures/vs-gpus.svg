<svg xmlns="http://www.w3.org/2000/svg" width="780" height="368" viewBox="0 0 780 368" role="img" aria-label="Efficiency multiple of each ASIC design version vs H100 and B200">
<title>Efficiency multiple of each ASIC design version vs H100 and B200</title>
<style>text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif} .title{font-size:16px;font-weight:600} .sub{font-size:12px} .lab{font-size:12px} .lab2{font-size:11px} .val{font-size:11.5px;font-variant-numeric:tabular-nums} .tick{font-size:11px;font-variant-numeric:tabular-nums} .note{font-size:11px} .grid,.base,.ref{stroke-width:1} .ring{stroke-width:2} .l1,.l2,.l3{stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round} .refbold{stroke-width:2.5} .strong{font-size:12.5px;font-weight:600} .b1,.b2,.b3{stroke:none} .w1,.w2{stroke-width:2;stroke-linecap:round}
.bg{fill:#fcfcfb} .title,.lab,.val{fill:#0b0b0b} .sub,.lab2{fill:#52514e} .tick,.note{fill:#898781} .grid{stroke:#e1e0d9} .base{stroke:#c3c2b7} .ref{stroke:#52514e} .wash{fill:rgba(11,11,11,0.05)} .ring{stroke:#fcfcfb} .f1{fill:#2a78d6} .f2{fill:#eb6834} .f3{fill:#1baf7a} .f4{fill:#eda100} .l1,.w1{stroke:#2a78d6} .l2,.w2{stroke:#eb6834} .l3{stroke:#1baf7a} .b1{fill:#2a78d6;fill-opacity:0.2} .b2{fill:#eb6834;fill-opacity:0.2} .b3{fill:#1baf7a;fill-opacity:0.2} .refbold{stroke:#0b0b0b} .strong{fill:#0b0b0b}
@media (prefers-color-scheme: dark) { .bg{fill:#1a1a19} .title,.lab,.val{fill:#f0efec} .sub,.lab2{fill:#c3c2b7} .tick,.note{fill:#898781} .grid{stroke:#2c2c2a} .base{stroke:#383835} .ref{stroke:#c3c2b7} .wash{fill:rgba(255,255,255,0.06)} .ring{stroke:#1a1a19} .f1{fill:#3987e5} .f2{fill:#d95926} .f3{fill:#199e70} .f4{fill:#c98500} .l1,.w1{stroke:#3987e5} .l2,.w2{stroke:#d95926} .l3{stroke:#199e70} .b1{fill:#3987e5;fill-opacity:0.2} .b2{fill:#d95926;fill-opacity:0.2} .b3{fill:#199e70;fill-opacity:0.2} .refbold{stroke:#f0efec} .strong{fill:#f0efec} }</style>
<rect x="0.0" y="0.0" width="780.0" height="368.0" rx="0" class="bg"/>
<text x="20.0" y="28.0" class="title" text-anchor="start">How many times more efficient than a GPU?</text>
<text x="20.0" y="47.0" class="sub" text-anchor="start">Wall-to-wall FP8 efficiency multiple, log scale, with the x0.5 / x2 switching-energy band.</text>
<rect x="20.0" y="65.0" width="10.0" height="10.0" rx="2" class="f1"/>
<text x="35.0" y="74.0" class="lab" text-anchor="start">vs H100 SXM</text>
<rect x="114.6" y="65.0" width="10.0" height="10.0" rx="2" class="f2"/>
<text x="129.6" y="74.0" class="lab" text-anchor="start">vs B200</text>
<line x1="190.0" y1="88.0" x2="190.0" y2="318.0" class="grid"/>
<text x="190.0" y="334.0" class="tick" text-anchor="middle">3×</text>
<line x1="308.1" y1="88.0" x2="308.1" y2="318.0" class="grid"/>
<text x="308.1" y="334.0" class="tick" text-anchor="middle">10×</text>
<line x1="415.9" y1="88.0" x2="415.9" y2="318.0" class="grid"/>
<text x="415.9" y="334.0" class="tick" text-anchor="middle">30×</text>
<line x1="534.0" y1="88.0" x2="534.0" y2="318.0" class="grid"/>
<text x="534.0" y="334.0" class="tick" text-anchor="middle">100×</text>
<line x1="641.8" y1="88.0" x2="641.8" y2="318.0" class="grid"/>
<text x="641.8" y="334.0" class="tick" text-anchor="middle">300×</text>
<line x1="190.0" y1="318.0" x2="670.0" y2="318.0" class="base"/>
<line x1="534.0" y1="88.0" x2="534.0" y2="318.0" class="ref"/>
<text x="538.0" y="84.0" class="lab2" text-anchor="start">100× goal</text>
<text x="20.0" y="124.0" class="lab" text-anchor="start">PA-1 Baseline</text>
<text x="20.0" y="139.0" class="lab2" text-anchor="start">reference only</text>
<line x1="315.6" y1="118.0" x2="433.1" y2="118.0" class="w1"/>
<circle cx="377.0" cy="118.0" r="5" class="f1 ring"/>
<text x="441.1" y="122.0" class="val" text-anchor="start">20× H100</text>
<line x1="268.2" y1="140.0" x2="385.6" y2="140.0" class="w2"/>
<circle cx="329.6" cy="140.0" r="5" class="f2 ring"/>
<text x="393.6" y="144.0" class="val" text-anchor="start">12× B200</text>
<text x="20.0" y="198.0" class="lab" text-anchor="start">PA-2 Near-threshold</text>
<text x="20.0" y="213.0" class="lab2" text-anchor="start">RECOMMENDED</text>
<line x1="422.8" y1="192.0" x2="542.2" y2="192.0" class="w1"/>
<circle cx="484.9" cy="192.0" r="5" class="f1 ring"/>
<text x="550.2" y="196.0" class="val" text-anchor="start">61× H100</text>
<line x1="375.3" y1="214.0" x2="494.7" y2="214.0" class="w2"/>
<circle cx="437.5" cy="214.0" r="5" class="f2 ring"/>
<text x="502.7" y="218.0" class="val" text-anchor="start">37× B200</text>
<text x="20.0" y="272.0" class="lab" text-anchor="start">PA-3 Stacked N2</text>
<text x="20.0" y="287.0" class="lab2" text-anchor="start">stretch</text>
<line x1="489.2" y1="266.0" x2="608.9" y2="266.0" class="w1"/>
<circle cx="551.5" cy="266.0" r="5" class="f1 ring"/>
<text x="616.9" y="270.0" class="val" text-anchor="start">119× H100</text>
<line x1="441.8" y1="288.0" x2="561.4" y2="288.0" class="w2"/>
<circle cx="504.0" cy="288.0" r="5" class="f2 ring"/>
<text x="569.4" y="292.0" class="val" text-anchor="start">74× B200</text>
</svg>
