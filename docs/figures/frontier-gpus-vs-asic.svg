<text x="62.0" y="402.7" class="tick" text-anchor="end">50</text>
<line x1="70.0" y1="329.6" x2="590.0" y2="329.6" class="grid"/>
<text x="62.0" y="333.6" class="tick" text-anchor="end">100</text>
<line x1="70.0" y1="260.4" x2="590.0" y2="260.4" class="grid"/>
<text x="62.0" y="264.4" class="tick" text-anchor="end">200</text>
<line x1="70.0" y1="169.1" x2="590.0" y2="169.1" class="grid"/>
<text x="62.0" y="173.1" class="tick" text-anchor="end">500</text>
<line x1="70.0" y1="100.0" x2="590.0" y2="100.0" class="grid"/>
<text x="62.0" y="104.0" class="tick" text-anchor="end">1000</text>
<text x="70.0" y="506.0" class="tick" text-anchor="middle">1%</text>
<text x="200.0" y="506.0" class="tick" text-anchor="middle">2%</text>
<text x="330.0" y="506.0" class="tick" text-anchor="middle">3%</text>
<text x="460.0" y="506.0" class="tick" text-anchor="middle">4%</text>
<text x="590.0" y="506.0" class="tick" text-anchor="middle">5%</text>
<line x1="70.0" y1="490.0" x2="590.0" y2="490.0" class="base"/>
<text x="590.0" y="524.0" class="note" text-anchor="end">Pearl mining overhead on an inference GPU</text>
<text x="62.0" y="88.0" class="note" text-anchor="start">effective TFLOPS/W</text>
<line x1="70.0" y1="268.0" x2="590.0" y2="268.0" class="ref"/>
<text x="598.0" y="272.0" class="lab2" text-anchor="start">PA-3 stretch: 185 TF/W</text>
