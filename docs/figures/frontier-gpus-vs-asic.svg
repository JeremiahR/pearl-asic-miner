<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600" role="img" aria-label="Effective Pearl efficiency of frontier NVIDIA GPUs at 1-5% overhead vs our best ASIC">
<title>Effective Pearl efficiency of frontier NVIDIA GPUs at 1-5% overhead vs our best ASIC</title>
<style>text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif} .title{font-size:16px;font-weight:600} .sub{font-size:12px} .lab{font-size:12px} .lab2{font-size:11px} .val{font-size:11.5px;font-variant-numeric:tabular-nums} .tick{font-size:11px;font-variant-numeric:tabular-nums} .note{font-size:11px} .grid,.base,.ref{stroke-width:1} .ring{stroke-width:2} .l1,.l2,.l3{stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round} .refbold{stroke-width:2.5} .strong{font-size:12.5px;font-weight:600} .b1,.b2,.b3{stroke:none} .w1,.w2{stroke-width:2;stroke-linecap:round}
