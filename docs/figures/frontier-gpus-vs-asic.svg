<rect x="0.0" y="0.0" width="820.0" height="600.0" rx="0" class="bg"/>
<text x="20.0" y="28.0" class="title" text-anchor="start">The bar our best ASIC must clear moves with Pearl's overhead, and with every NVIDIA generation</text>
<text x="20.0" y="47.0" class="sub" text-anchor="start">Effective Pearl efficiency of a GPU already doing FP8 inference = wall TFLOPS/W ÷ mining overhead. Labels: 1% → 5%. Log scale.</text>
<rect x="20.0" y="63.0" width="10.0" height="10.0" rx="2" class="f1"/>
<text x="35.0" y="72.0" class="lab" text-anchor="start">Hopper H100/H200</text>
<rect x="147.6" y="63.0" width="10.0" height="10.0" rx="2" class="f2"/>
<text x="162.6" y="72.0" class="lab" text-anchor="start">Blackwell B200/B300/GB200</text>
<rect x="334.6" y="63.0" width="10.0" height="10.0" rx="2" class="f3"/>
<text x="349.6" y="72.0" class="lab" text-anchor="start">Rubin VR200 (announced)</text>
<rect x="70.0" y="335.6" width="520.0" height="154.4" rx="0" class="wash"/>
<text x="582.0" y="480.0" class="note" text-anchor="end">below the bold line: our ASIC is more efficient</text>
<text x="582.0" y="114.0" class="note" text-anchor="end">above it: inference GPUs mine Pearl more efficiently</text>
<line x1="70.0" y1="490.0" x2="590.0" y2="490.0" class="grid"/>
<text x="62.0" y="494.0" class="tick" text-anchor="end">20</text>
